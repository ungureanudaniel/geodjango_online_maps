server {
    listen 80;
    server_name map.bucegipark.ro;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name map.bucegipark.ro;

    ssl_certificate     /etc/nginx/ssl/map.bucegipark.ro.crt;
    ssl_certificate_key /etc/nginx/ssl/map.bucegipark.ro.key;

    # Modern SSL hardening
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location /static/ {
        alias /static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass         http://web:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # important — GeoJSON layers can be large
    }
}