events {}

http {
    # optimizing with GZIP 
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/geo+json
        application/javascript
        application/xml
        application/xml+rss
        application/rss+xml
        image/svg+xml;
    server {
        listen 80;
        server_name map.bucegipark.ro;
        return 301 https://$host$request_uri;

    }
    server {
        listen 443 ssl;
        server_name map.bucegipark.ro;

        ssl_certificate     /etc/nginx/ssl/map.bucegipark.ro.crt;
        ssl_certificate_key /etc/nginx/ssl/map.bucegipark.ro.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        client_max_body_size 100M;
        
        location /static/ {
            alias /static/;
        }

        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}