services:
  web:
    build: .
    container_name: bucegi_geodjango
    restart: unless-stopped
    command: gunicorn bucegi_map.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/static
    ports:
      - "8095:8080"
    environment:
      - DB_NAME=bucegi_gis_db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=198.168.0.98
      - DB_PORT=5432
      - DJANGO_ALLOWED_HOSTS=${ALLOWED_HOSTS}

  nginx:
    image: nginx:alpine
    container_name: bucegi_nginx
    restart: unless-stopped
    ports:
      - "8097:80"
      # - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - static_volume:/static:ro
    depends_on:
      - web

volumes:
  static_volume: